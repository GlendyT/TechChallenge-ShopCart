                                                                                                                    
    services:                                                                                                       
      sqlserver:                                                                                                    
        image: mcr.microsoft.com/mssql/server:2022-latest                                                           
        container_name: shopcart-sqlserver                                                                          
        restart: always                                                                                             
        environment:                                                                                                
          ACCEPT_EULA: "Y"                                                                                          
          MSSQL_SA_PASSWORD: "TuPasswordSeguro123!"                                                                 
          MSSQL_PID: "Developer"                                                                                    
        ports:                                                                                                      
          - "1433:1433"                                                                                             
        volumes:                                                                                                    
          - mssql_data:/var/opt/mssql                                                                               
                                                                                                                    
    volumes:                                                                                                        
      mssql_data:                                                                                                   
        driver: local  