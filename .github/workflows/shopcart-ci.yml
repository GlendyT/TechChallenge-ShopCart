name: ShopCart CI

on:
  push:
    branches:
      - main
      - develop
      - frontend
      - 'DB/backend'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and component tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End to end tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  create-pull-request:
    name: Create pull request
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Select destination branch
        id: destination
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in
            frontend|DB/backend) echo "branch=develop" >> "$GITHUB_OUTPUT" ;;
            develop) echo "branch=main" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported source branch: $SOURCE_BRANCH" >&2; exit 1 ;;
          esac

      - name: Create pull request if one is not already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: ${{ steps.destination.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          open_pr=$(gh pr list \
            --state open \
            --head "${GITHUB_REPOSITORY_OWNER}:${SOURCE_BRANCH}" \
            --base "$BASE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$open_pr" ]]; then
            echo "Pull request #$open_pr already exists; it will include the pushed commits."
          else
            if create_output=$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "Integrate $SOURCE_BRANCH into $BASE_BRANCH" \
              --body "Frontend and backend checks passed for this branch. Please review and merge when ready." 2>&1); then
              echo "$create_output"
            else
              create_status=$?
              if grep -qi "a pull request for branch .* already exists" <<< "$create_output"; then
                echo "A pull request from $SOURCE_BRANCH to $BASE_BRANCH already exists; skipping creation."
              else
                printf '%s\n' "$create_output" >&2
                exit "$create_status"
              fi
            fi
          fi
